<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Electro Montana</title>
<meta name="description" content="Clientes, ventas a crédito y cobros de Electro Montana">
<meta name="theme-color" content="#172b4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="E. Montana">
<link rel="apple-touch-icon" href="img/icono-180.png?v=1">
<link rel="icon" type="image/png" href="img/favicon-32.png?v=1">
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="preload" href="fonts/barlow-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css?v=5">
</head>
<body>

<!-- Entrada -->
<section id="pantallaLogin" class="login" hidden>
  <div class="login-caja">
    <div class="login-marca">
      <span id="loginLogo"></span>
      <div class="marca-txt"><small>ELECTRO</small>MONTANA</div>
      <div class="lema">Todo a tu alcance</div>
    </div>
    <form id="formLogin" class="tarjeta pila" autocomplete="on">
      <h2>Entrar</h2>
      <label class="campo"><span>Usuario</span>
        <input id="loginUsuario" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Ej.: franklin" required>
      </label>
      <label class="campo"><span>Clave</span>
        <input id="loginClave" name="password" type="password" autocomplete="current-password" required>
      </label>
      <div id="loginError" class="login-error" hidden></div>
      <button class="btn btn-ancho" id="btnEntrar" type="submit">Entrar</button>
    </form>
  </div>
</section>

<!-- Aplicación -->
<div id="app" class="app" hidden>
  <header class="barra-sup">
    <span id="barraLogo"></span>
    <h1 id="tituloVista">Cobrar</h1>
    <button class="chip-sup" id="chipCola" type="button" hidden></button>
    <button class="chip-sup" id="chipTasa" type="button">Tasa</button>
  </header>
  <main id="vista" class="contenido"></main>
  <nav class="barra-tabs" id="navTabs"></nav>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<!-- En cada entrega: subir el ?v= aquí y la VERSION de sw.js -->
<script src="js/vendor/supabase-2.49.4.js"></script>
<script src="js/config.js?v=5"></script>
<script src="js/cuentas.js?v=5"></script>
<script src="js/base.js?v=5"></script>
<script src="js/datos.js?v=5"></script>
<script src="js/contrato.js?v=5"></script>
<script src="js/firma.js?v=5"></script>
<script src="js/cobrar.js?v=5"></script>
<script src="js/clientes.js?v=5"></script>
<script src="js/vender.js?v=5"></script>
<script src="js/abonos.js?v=5"></script>
<script src="js/ventas.js?v=5"></script>
<script src="js/notas.js?v=5"></script>
<script src="js/mercancia.js?v=5"></script>
<script src="js/reportes.js?v=5"></script>
<script src="js/entregas.js?v=5"></script>
<script src="js/ajustes.js?v=5"></script>
<script src="js/app.js?v=5"></script>
</body>
</html>
